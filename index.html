<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وِصال | WISAL AI</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--t:#168B8A;--td:#0F706F;--tl:#E6F6F5;--tb:#F1FAF9;--bg:#F8FAFA;--c:#fff;--ink:#172525;--i2:#657574;--i3:#899998;--ln:#DCE7E6;--ok:#16856B;--okb:#E8F6F1;--wn:#B7791F;--wnb:#FFF7E6;--er:#C0392B;--erb:#FDECEC;--in:#2563EB;--inb:#EEF4FF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--c);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 28px;flex-wrap:wrap}
.br{display:flex;gap:10px;align-items:center;cursor:pointer}.br b{font-size:21px;font-weight:700}.br small{display:block;color:var(--i2);font-size:11px;line-height:1.3}.br em{font-style:normal;color:var(--t);font-size:11px;font-weight:500;margin-inline-start:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav a{padding:7px 14px;border-radius:10px;color:var(--i2);font-weight:500;cursor:pointer}nav a.on{background:var(--tl);color:var(--t)}
.w{max-width:1200px;margin:0 auto;padding:40px 24px 64px}
h1{font-size:clamp(26px,4vw,38px);font-weight:700;line-height:1.3}.sub{color:var(--i2);font-size:18px;margin:8px 0 26px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--t);background:var(--t);color:#fff;padding:12px 24px;border-radius:12px;font:500 16px Tajawal;cursor:pointer;min-height:48px}
.btn:hover{background:var(--td)}.btn.s{background:var(--c);color:var(--t)}.btn.o{background:none;color:var(--ink);border-color:var(--ln)}.btn.big{padding:15px 30px;font-size:18px}
.btn:focus-visible,nav a:focus-visible,.pick:focus-visible,textarea:focus-visible{outline:3px solid var(--in);outline-offset:2px}
.c{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(23,37,37,.05)}
.g{display:grid;gap:20px}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.chip{display:inline-flex;gap:5px;align-items:center;border-radius:99px;padding:3px 12px;font-size:14px;font-weight:500}
.ok{color:var(--ok);background:var(--okb)}.wn{color:var(--wn);background:var(--wnb)}.er{color:var(--er);background:var(--erb)}.in{color:var(--in);background:var(--inb)}.tl{color:var(--t);background:var(--tl)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sb{justify-content:space-between}.cn{justify-content:center;text-align:center}
h3{font-size:21px;font-weight:700;margin-bottom:8px}p{color:var(--i2)}
.ic{width:42px;height:42px;border-radius:50%;background:var(--tl);color:var(--t);display:grid;place-items:center;font-size:20px;flex:none}
.pick{cursor:pointer;border:1px solid var(--ln);border-radius:14px;padding:16px;background:var(--c)}.pick.on{border:2px solid var(--t);background:var(--tb)}
textarea{width:100%;min-height:200px;border:1px solid var(--ln);border-radius:12px;padding:16px;font:17px/1.8 Tajawal;background:var(--bg);color:var(--ink);resize:vertical}
.bar{height:8px;border-radius:4px;background:var(--tl);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--t);border-radius:4px}
.step{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:12px;color:var(--i3)}.step.d{color:var(--ink)}.step.n{background:var(--tb);border:1px solid #B7DEDC;color:var(--td);font-weight:700}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;flex:none}.d .dot{background:var(--okb);color:var(--ok);border:0}.n .dot{border-color:var(--t);color:var(--t)}
.tag{border:1px solid var(--ln);border-radius:8px;padding:2px 10px;font-size:13px;color:var(--i2);background:var(--bg)}
.hl{color:var(--td);font-weight:500}.note{padding:14px 18px;border-radius:14px;display:flex;gap:12px;align-items:flex-start}
.big{font-size:clamp(34px,5.5vw,56px);font-weight:700;line-height:1.35}.big span{color:var(--t)}
.sw{width:46px;height:26px;border-radius:13px;background:var(--ln);position:relative;cursor:pointer;border:0}.sw.on{background:var(--t)}.sw:after{content:"";position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on:after{right:24px}
.strip{border-top:1px solid var(--ln);background:var(--c);padding:28px;text-align:center;font-size:24px;font-weight:700;color:var(--td);margin:0}
a.l{color:var(--t);font-weight:500;cursor:pointer}
</style></head><body><div id="app"></div>
<script>
const SAMPLE='الإسلام دين التوحيد، ويجب على كل إنسان أن يعرف خالقه ويعبده وحده دون شريك. ومن لم يفعل ذلك فقد ضيّع الغاية من وجوده. والتوحيد هو أصل الرسالات كلها، ومن فهم معناه عرف حقيقة العبودية والاستسلام لله.';
const LOGO='<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#168B8A"/><path d="M9 26C13 11 27 11 31 26" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="9" cy="27" r="2.8" fill="#fff"/><circle cx="31" cy="27" r="2.8" fill="#fff"/></svg>';
let cur='home',aud=1,goal=2,txt='',cust=false,custText='',ps=0,timer=null,ai=null,aiErr='',analyzing=false,approvedSources=[];
const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://localhost:3000':(location.origin.includes('wisal-ai-api.onrender.com')?'':'https://wisal-ai-api.onrender.com');
const NAV=[['الرئيسية','home'],['المحرر','ed'],['كيف يعمل؟','how'],['المصادر','src'],['عن وِصال','about']];
const ACT={home:0,ed:1,proc:1,ana:1,rw:1,ver:1,src:3,ba:0,how:2,meth:4,safe:4,demo:0,st:1,about:4};
const chip=(k,t)=>`<span class="chip ${k}">${{ok:'✓',wn:'⚠',er:'✕',in:'ℹ',tl:''}[k]} ${t}</span>`;
const btn=(t,g,c='')=>`<button class="btn ${c}" data-go="${g}">${t}</button>`;
const ico=(s,c='')=>`<div class="ic ${c}">${s}</div>`;
function hdr(){return `<header><div class="br" data-go="home" tabindex=0>${LOGO}<div><b>وِصال<em>WISAL AI</em></b><small>نُحسّن طريقة الإيصال، ونحافظ على المعنى.</small></div></div><nav aria-label="التنقل">${NAV.map((n,i)=>`<a tabindex=0 data-go="${n[1]}" class="${ACT[cur]===i?'on':''}">${n[0]}</a>`).join('')}</nav>${btn('ابدأ الآن','ed')}</header>`}
const T=(h,s)=>`<h1>${h}</h1><p class="sub">${s}</p>`;
const bar=(l,v)=>`<div style="margin-bottom:16px"><div class="row sb"><b>${l}</b><b style="color:var(--t)">${v}%</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`;
const S={
home:()=>`<div class="g g2" style="align-items:center;min-height:560px"><div><span class="chip tl" style="border:1px solid #B7DEDC;margin-bottom:20px">✦ ذكاء اصطناعي • مصادر موثوقة • حفاظ على المعنى</span><div class="big">طوّر رسالتك الدعوية<br><span>لتصل بأثرٍ أعمق.</span></div><p class="sub" style="font-size:20px">وِصال يساعدك على تكييف أسلوب المحتوى الإسلامي مع طبيعة جمهورك، مع الحفاظ على المعنى والمضمون الأصلي.</p><div class="row">${btn('ابدأ تحليل النص ←','ed','big')}${btn('كيف يعمل وِصال؟','how','s big')}</div><p style="margin-top:18px">▶ <a class="l" data-go="demo">تجربة مثال</a> — جرّب وِصال بنص جاهز في ثوانٍ</p></div>
<div class="c" style="background:var(--tb);border-radius:28px;padding:28px;display:grid;gap:10px;justify-items:center"><div class="c" style="width:100%"><b>رسالتك</b><div class="bar" style="height:8px;background:var(--ln)"></div><div class="bar" style="background:var(--ln)"></div><div class="bar" style="width:60%;background:var(--ln)"></div></div><div class="ic" style="background:var(--c);border:1px solid #B7DEDC">↓</div><div class="c cn" style="width:100%;border:1.5px solid var(--t)">${LOGO}<h3 style="margin:8px 0 2px">وِصال AI</h3><p style="font-size:14px">تحليل الأسلوب • فهم الجمهور • تحسين الإيصال</p></div><div class="ic" style="background:var(--c);border:1px solid #B7DEDC">↓</div><div class="c" style="width:100%"><b>جمهورك</b><div class="row" style="margin-top:8px">${['عام','عقلاني','روحي'].map(x=>`<span class="chip tl" style="border:1px solid #B7DEDC">${x}</span>`).join('')}</div></div></div></div><p class="strip">وِصال لا يغيّر رسالتك، بل يساعدها على الوصول.</p>`,
ed:()=>`${T('لنبدأ برسالتك','أدخل النص الذي تريد تحسين طريقة تقديمه، ثم أخبر وِصال بمن تخاطب.')}<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))"><div class="g" style="grid-column:span 2"><div class="c"><h3>01 — أدخل النص</h3><p style="margin-bottom:10px">النص المراد تحليله</p><textarea id=ta aria-label="النص" placeholder="الصق هنا النص الذي تريد تحليل أسلوبه أو تحسين طريقة تقديمه...">${txt}</textarea><div class="row sb" style="margin-top:8px;font-size:14px"><span id=wc style="color:var(--i3)">${txt.trim()?txt.trim().split(/\s+/).length:0} / 1500 كلمة</span><a class="l" data-act="ex">✦ استخدام مثال جاهز</a></div></div>
<div class="c"><h3>02 — من جمهورك؟</h3><p style="margin-bottom:14px">اختر الأسلوب الأقرب إلى طبيعة الجمهور الذي تخاطبه.</p><div class="g g3">${[['👥','جمهور عام','بسيط وواضح — مناسب لمن يريد فهم الفكرة دون خلفية متخصصة.'],['💡','جمهور عقلاني','منطقي ومتزن — مناسب لمن يفضّل التفسير المنطقي والطرح المتدرج.'],['♡','جمهور روحي','إنساني وتأملي — مناسب لمن يتفاعل مع المعاني والقيم والتأمل.']].map((a,i)=>`<div class="pick ${aud===i?'on':''}" tabindex=0 role=radio aria-checked="${aud===i}" data-act="aud${i}">${ico(a[0])}<b style="display:block;margin:8px 0 2px;font-size:18px">${a[1]} ${aud===i?'<span class="chip ok">✓</span>':''}</b><span style="color:var(--i2);font-size:14px">${a[2]}</span></div>`).join('')}</div>
<div class="row sb" style="border-top:1px solid var(--ln);margin-top:16px;padding-top:14px"><div><b>تخصيص الجمهور</b><br><small style="color:var(--i3)">أضف وصفًا أدق لمن تخاطب (اختياري)</small></div><button class="sw ${cust?'on':''}" role=switch aria-checked="${cust}" aria-label="تخصيص الجمهور" data-act="cust"></button></div>${cust?'<textarea id="custTa" style="min-height:70px;margin-top:12px;border-color:var(--t)" placeholder="صف جمهورك بكلمات بسيطة...">${custText}</textarea>':''}</div></div>
<div class="g" style="align-content:start"><div class="c"><h3>03 — ماذا تريد من وِصال؟</h3>${['تحليل الأسلوب فقط','اقتراح تحسين','تحليل الأسلوب واقتراح تحسين'].map((x,i)=>`<div class="pick ${goal===i?'on':''}" style="margin-top:10px" tabindex=0 role=radio aria-checked="${goal===i}" data-act="goal${i}">${goal===i?'◉':'○'} ${x}</div>`).join('')}</div>
<div class="note" style="background:var(--tb);border:1px solid var(--tl)"><span style="font-size:22px">🛡</span><div><b>حماية المعنى والمضمون</b><p style="font-size:14px">يعمل وِصال على تحسين أسلوب الإيصال والوضوح، ولا يهدف إلى إصدار أحكام شرعية أو تغيير المحتوى العلمي.</p><a class="l" data-go="meth" style="font-size:14px">اعرف المزيد عن منهجية التحقق</a></div></div>
<button class="btn big" style="justify-content:center" data-act="go">حلّل النص باستخدام وِصال ←</button><p class="cn" style="font-size:14px;text-align:center">تستغرق العملية بضع ثوانٍ.</p></div></div>`,
proc:()=>`<div class="cn" style="text-align:center">${LOGO.replace('width="40" height="40"','width="72" height="72"')}${T('وِصال يقرأ رسالتك...','نحلل أسلوب النص ونبحث عن أفضل طريقة لإيصاله إلى الجمهور المحدد.')}</div><div class="c" style="max-width:620px;margin:0 auto"><div class="row sb" style="font-size:14px"><span>الخطوة ${Math.min(ps+1,6)} من 6</span><b style="color:var(--t)">${Math.round(ps/6*100)}%</b></div><div class="bar" style="margin:8px 0 14px"><i style="width:${ps/6*100}%"></i></div>${['فهم النص','تحليل أسلوب الخطاب','فهم طبيعة الجمهور','مراجعة المصادر ذات الصلة','إعداد الاقتراح','التحقق من النتيجة'].map((x,i)=>`<div class="step ${i<ps?'d':i==ps?'n':''}"><span class="dot">${i<ps?'✓':i==ps?'●':''}</span>${x}</div>`).join('')}</div><p class="cn" style="text-align:center;margin-top:24px;color:var(--td);font-weight:500">نحن لا نبحث عن تغيير رسالتك، بل عن أفضل طريقة لإيصالها.</p>`,
ana:()=>`${T('تحليل وِصال لرسالتك','هذه نتيجة النص الذي أدخلته فعليًا، وليست حالة تجريبية.')}<div class="note" style="background:var(--tb);border:1px solid #B7DEDC;margin-bottom:20px">${ico('✦')}<div><small style="color:var(--t);font-weight:700">الانطباع العام</small><div style="font-size:20px;font-weight:500">${esc(ai?.impression||'اكتمل التحليل.')}</div></div></div><div class="g g2"><div class="c"><h3>نقاط القوة</h3><br>${(ai?.strengths||[]).map((x,n)=>`<div class="row" style="align-items:flex-start;margin-bottom:14px">${ico('✓')}<div><b>نقطة ${n+1}</b><p>${esc(x)}</p></div></div>`).join('')||'<p>لم تُسجّل نقاط قوة إضافية.</p>'}</div><div class="c"><h3>ما الذي يحتاج تحسينًا؟</h3><br>${(ai?.improvements||[]).map((x,n)=>`<div class="row" style="align-items:flex-start;margin-bottom:14px">${ico(String(n+1))}<div><b>ملاحظة ${n+1}</b><p>${esc(x)}</p></div></div>`).join('')||'<p>لم تُسجّل ملاحظات إضافية.</p>'}</div></div><div class="note in" style="margin-top:20px"><div><b>المصادر المرتبطة بهذه النتيجة: ${ai?.sources?.length||0}</b><p>${ai?.sources?.length?'يمكنك فتح صفحة المصادر لرؤية المراجع التي استُخدمت فعليًا.':'لم يُستخدم مصدر خارجي في هذه النتيجة، لذلك لن يعرض وِصال مصدرًا وهميًا.'}</p></div></div><div class="row" style="margin-top:24px">${btn('عرض اقتراح وِصال ←','rw','big')}${btn('عرض المصادر','src','s')}</div>`,
rw:()=>`${T('كيف يمكن أن تصل الرسالة بشكل أفضل؟','يقترح وِصال تحسينات أسلوبية تتناسب مع الجمهور المحدد، مع الحفاظ على الفكرة الأساسية.')}<div class="g g2"><div class="c"><div class="row sb"><h3>النص الأصلي</h3>${chip('in','كما أدخلته')}</div><p style="font-size:18px;line-height:2;color:var(--ink)">${esc(txt.trim()||SAMPLE)}</p></div><div class="c" style="border:1.5px solid var(--t)"><div class="row sb"><h3 style="color:var(--td)">✦ اقتراح وِصال</h3>${chip('tl','تعديلات مميّزة')}</div><p style="font-size:18px;line-height:2;color:var(--ink)">${ai?.rewrite?esc(ai.rewrite):'<span style="color:var(--er)">لا توجد صياغة مولّدة بعد. أعد التحليل للحصول على نتيجة فعلية.</span>'}</p></div></div><h3 style="margin:26px 0 12px">لماذا اقترح وِصال هذه التغييرات؟</h3><div class="g g5" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${[['تحسين الوضوح','تبسيط الجمل الطويلة والمصطلحات التي قد تحتاج إلى توضيح.'],['زيادة التدرج','تقديم الفكرة بصورة متدرجة قبل الانتقال إلى النتيجة أو التوجيه.'],['مراعاة الجمهور','استخدام أسلوب يتناسب مع طبيعة الجمهور المحدد.'],['الحفاظ على المعنى','لم يُقصد من التعديل تغيير الفكرة الأساسية للنص.']].map(w=>`<div class="c" style="padding:18px"><div class="row">${chip('ok','')}<b>${w[0]}</b></div><p style="font-size:14px;margin-top:6px">${w[1]}</p></div>`).join('')}</div><div class="row" style="margin-top:24px">${btn('✓ اعتماد الاقتراح','ba')}<button class="btn o" data-act="copy">⧉ نسخ النص</button>${btn('✎ تعديل يدويًا','ed','o')}${btn('↻ إعادة التحليل','proc','o')}${btn('عرض التحقق والمصادر ←','ver','s')}</div>`,
ver:()=>`${T('كيف تحقّق وِصال من النتيجة؟','يخضع الاقتراح لمجموعة من الفحوصات الآلية قبل عرضه للمستخدم.')}<div class="g g2"><div class="c"><h3>مراحل الفحص</h3>${['تحليل النص الأصلي','تحديد العناصر القابلة للتحسين أسلوبيًا','استرجاع المصادر ذات الصلة عند الحاجة','فحص الاقتراح','مقارنة المعنى بين النصين','التحقق من عدم اختلاق مصدر'].map(x=>`<div class="row" style="padding:10px 0">${chip('ok','')}<span style="font-size:18px">${x}</span></div>`).join('')}</div><div class="g"><div class="note ok" style="border:1px solid #BFE3D6"><span style="font-size:26px">🛡</span><div><small>حالة التحقق</small><div style="font-size:20px;font-weight:700">✓ اجتازت النتيجة فحوصات السلامة</div><p style="font-size:15px">يشير هذا الفحص إلى اجتياز الاختبارات الآلية المحددة للنظام، ولا يُعد فتوى أو حكمًا شرعيًا نهائيًا.</p></div></div><div class="c"><h3>فحص الحفاظ على المعنى</h3><p style="color:var(--ink)">حالة الاتساق الدلالي: ${chip('ok','ناجح')}</p><p style="font-size:15px;margin-top:6px">لم يظهر اختلاف جوهري في العناصر الأساسية بين النص الأصلي والصياغة المقترحة وفق فحص النظام.</p></div><div class="note wn" style="border:1px solid #EBD7A8"><span>⚠</span><div><b>تنبيه</b><p style="font-size:15px">التحقق الآلي أداة مساعدة، ولا يغني عن المراجعة البشرية المتخصصة عند الحاجة.</p></div></div></div></div><div class="row" style="margin-top:24px">${btn('عرض المصادر ←','src','big')}${btn('العودة إلى الاقتراح','rw','o big')}</div>`,
src:()=>`${T('المصادر المعتمدة','لا يستخدم وِصال إلا المصادر التسعة التي حددتها صاحبة المشروع، ويبيّن بشكل منفصل ما استُخدم فعليًا في التحليل الحالي.')}${(ai?.sources||[]).length?`<h3 style="margin:0 0 12px">المصادر المستخدمة في النتيجة الحالية</h3><div class="g g2" style="margin-bottom:28px">${ai.sources.map((s,n)=>`<div class="c"><div class="row sb"><b style="color:var(--t)">المصدر ${String(n+1).padStart(2,'0')}</b>${chip('ok','مستخدم فعليًا')}</div><h3 style="margin:10px 0">📖 ${esc(s.name)}</h3><a class="btn s" href="${s.url}" target="_blank" rel="noopener">عرض المصدر ↗</a></div>`).join('')}</div>`:''}<h3 style="margin:0 0 12px">قائمة المصادر المعتمدة</h3><div class="g g2">${approvedSources.map((s,n)=>`<div class="c"><div class="row sb"><b style="color:var(--t)">${String(n+1).padStart(2,'0')}</b>${(ai?.sources||[]).some(x=>x.id===s.id)?chip('ok','استُخدم الآن'):chip('tl','مصدر معتمد')}</div><h3 style="margin:10px 0">📖 ${esc(s.name)}</h3><div class="row" style="gap:6px;margin:4px 0 12px">${(s.tags||[]).map(t=>`<span class=tag>${esc(t)}</span>`).join('')}</div><a class="btn s" href="${s.url}" target="_blank" rel="noopener">فتح المصدر ↗</a></div>`).join('')}</div>${!approvedSources.length?`<div class="note wn" style="margin-top:20px">تعذر تحميل قائمة المصادر من الخادم حاليًا. أعد فتح الصفحة بعد لحظات.</div>`:''}`,
ba:()=>`${T('الفرق الذي يصنعه وِصال','نفس الرسالة، لكن بطريقة إيصال أنسب لجمهورها.')}<div class="g g2" style="align-items:stretch"><div class="c"><small style="color:var(--i3);font-weight:700">قبل</small><h3 style="font-size:24px;line-height:1.6;margin-top:8px">رسالة صحيحة، لكن أسلوبها قد لا يكون مناسبًا للجمهور المستهدف.</h3></div><div class="c" style="background:var(--tb);border:1.5px solid var(--t)"><small style="color:var(--t);font-weight:700">✦ بعد</small><h3 style="font-size:24px;line-height:1.6;color:var(--td);margin-top:8px">المعنى نفسه، بطريقة أوضح وأكثر ملاءمة للجمهور.</h3></div></div><div class="g g2" style="margin-top:20px"><div class="c"><h3>مقارنة النتيجة</h3>${[['المعنى','محفوظ'],['ملاءمة الأسلوب','محسّنة'],['الوضوح','محسّن'],['سهولة القراءة','محسّنة'],['المصادر','قابلة للتحقق']].map(r=>`<div class="row sb" style="padding:12px 0;border-top:1px solid var(--ln);font-size:17px"><b>${r[0]}</b>${chip('ok',r[1])}</div>`).join('')}</div><div class="c cn" style="display:grid;place-content:center;text-align:center;gap:10px;justify-items:center">${LOGO}<h3 style="font-size:28px;color:var(--td);line-height:1.5">وِصال لا يغيّر ما تقوله، بل يساعدك على تحسين طريقة قوله.</h3><p>تحسين في طريقة الإيصال، مع الحفاظ على المعنى المقصود.</p></div></div>`,
how:()=>`<div style="text-align:center">${T('من النص إلى الرسالة الأكثر ملاءمة','خمس خطوات واضحة، من إدخال النص حتى التحقق من النتيجة.')}</div><div class="g g5">${[['أدخل النص','يستقبل وِصال النص المراد تحليله.'],['تحليل أسلوب الخطاب','يحلل خصائص الأسلوب والوضوح والمباشرة والتعاطف.'],['فهم الجمهور','يأخذ طبيعة الجمهور المستهدف في الاعتبار.'],['تحسين طريقة الإيصال','يقترح صياغة أكثر ملاءمة مع الحفاظ على الفكرة الأساسية.'],['التحقق من النتيجة','يفحص الاقتراح ويعرض المصادر ذات الصلة عند استخدامها.']].map((s,i)=>`<div class="c"><div class="row sb">${ico(i+1)}<b style="font-size:30px;color:#B7DEDC">0${i+1}</b></div><h3 style="margin-top:12px">${s[0]}</h3><p style="font-size:15px">${s[1]}</p></div>`).join('')}</div><div class="row cn" style="margin:32px 0;font-size:20px;font-weight:700">رسالتك ← <span class="chip" style="background:var(--t);color:#fff;font-size:20px;padding:6px 22px">وِصال</span> ← جمهورك</div><div class="row cn">${btn('ابدأ تحليل النص ←','ed','big')}${btn('▷ تجربة مثال','demo','s big')}</div>`,
meth:()=>`<div class="row sb">${T('منهجية وِصال','كيف يعمل وِصال خلف الكواليس، بلغة بسيطة.')}${chip('tl','🛡 ذكاء اصطناعي مسؤول')}</div><div class="g g3">${[['✦','الذكاء الاصطناعي','يستخدم وِصال تقنيات الذكاء الاصطناعي لتحليل أسلوب الخطاب واقتراح تحسينات تتناسب مع طبيعة الجمهور.'],['📖','المصادر','تعتمد المعلومات ذات الصلة على مصادر موثوقة تُدار وتُراجع ضمن قاعدة معرفة مخصصة.'],['⌕','الاسترجاع المعزز بالمصادر','عند الحاجة إلى معلومة، يسترجع النظام المحتوى ذي الصلة من قاعدة المعرفة قبل استخدامه في النتيجة.'],['🛡','الحماية','لا يسمح النظام باختلاق المصادر أو تغيير الحكم أو المعنى العلمي المقصود.'],['✓','التحقق','تخضع المخرجات لفحوصات آلية تشمل سلامة الاقتراح والاتساق الدلالي والمصادر.']].map(m=>`<div class="c">${ico(m[0])}<h3 style="margin-top:12px">${m[1]}</h3><p>${m[2]}</p></div>`).join('')}<div class="c cn" style="background:var(--tb);border-color:#B7DEDC;display:grid;place-content:center;text-align:center;justify-items:center;gap:8px">${LOGO}<h3 style="color:var(--td)">ذكاء اصطناعي مسؤول</h3><p>أداة مساعدة، لا بديل عن المتخصص.</p></div></div>`,
safe:()=>`${T('السلامة أولًا','صُمم وِصال ليكون أداة مساعدة في تحسين طريقة التواصل، وليس بديلًا عن المتخصص.')}<div class="g g2">${[[1,'يسمح وِصال بـ',['تحسين الأسلوب','تحسين الوضوح','زيادة التدرج','تحسين ملاءمة الخطاب للجمهور','اقتراح صياغة بديلة','عرض المصادر ذات الصلة']],[0,'لا يسمح وِصال بـ',['اختلاق المصادر','تغيير حكم شرعي','اختراع معلومات','تقديم فتوى شخصية','إسناد قول إلى مصدر غير موجود','تجاوز المصادر والسياسات المحددة']]].map(c=>`<div class="c" style="border-color:${c[0]?'#BFE3D6':'#F0C4C0'}"><div class="row sb"><h3 style="color:var(--${c[0]?'ok':'er'})">${c[1]}</h3>${chip(c[0]?'ok':'er',c[0]?'مسموح':'غير مسموح')}</div>${c[2].map(x=>`<div class="row" style="padding:10px 0;border-top:1px solid var(--ln);font-size:18px">${chip(c[0]?'ok':'er','')}${x}</div>`).join('')}</div>`).join('')}</div><div class="note" style="background:var(--tb);margin-top:20px;border:1px solid #B7DEDC">🛡 <b style="color:var(--td)">وِصال يحسّن الإيصال فقط، ولا يغني عن المراجعة البشرية المتخصصة عند الحاجة.</b></div>`,
demo:()=>`<div style="text-align:center">${T('جرّب وِصال في ثوانٍ','مثال جاهز يعرض لك المسار كاملًا: من التحليل حتى المصادر.')}</div><div class="c" style="max-width:900px;margin:0 auto"><div class="row sb"><h3>✦ مثال تجريبي</h3>${chip('ok','تم التحميل تلقائيًا')}</div><div class="row sb" style="padding:12px 0;border-bottom:1px solid var(--ln)"><span>الجمهور</span>${chip('tl','💡 جمهور عقلاني')}</div><div class="row sb" style="padding:12px 0"><span>هدف الرسالة</span>${chip('tl','📖 التعريف بالإسلام')}</div><div style="background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:16px;font-size:17px;line-height:1.9">${SAMPLE}</div><p style="font-size:14px;margin:8px 0 18px">نص تجريبي معدّ مسبقًا لعرض آلية التحليل.</p><div class="cn" style="text-align:center"><button class="btn big" data-act="demogo">تحليل المثال ←</button></div></div><p class="cn" style="text-align:center;margin-top:24px;color:var(--i2)">المثال ← التحليل ← الاقتراح ← التحقق ← المصادر</p>`,
st:()=>{const empty=!txt.trim()&&!aiErr;const tooLong=wordCount(txt)>1500;const state=empty?['✎','tl','لم نبدأ بعد','أدخل نصًا أولًا لنبدأ التحليل.',btn('العودة إلى المحرر','ed')]:tooLong?['⚠','wn','النص يتجاوز الحد المسموح','قسّم النص إلى أجزاء أقصر من 1500 كلمة.',btn('تعديل النص','ed','s')]:['✕','er','حدث خطأ أثناء التحليل',aiErr||'تعذر إكمال التحليل في الوقت الحالي.',btn('↻ إعادة المحاولة','proc')];return `${T('حالة التحليل','يعرض وِصال الحالة الحالية فقط.')}<div class="c" style="max-width:650px;margin:auto;text-align:center;display:grid;gap:12px;justify-items:center"><div class="ic ${state[1]}" style="width:64px;height:64px;font-size:28px">${state[0]}</div><h3>${state[2]}</h3><p>${state[3]}</p>${state[4]}</div>`},
about:()=>`<div class="g g2" style="align-items:center;min-height:440px"><div><div class="row">${LOGO.replace('width="40" height="40"','width="64" height="64"')}<div><b style="font-size:34px;line-height:1.2">وِصال</b><br><small style="color:var(--t);font-weight:500">WISAL AI</small></div></div><div class="big" style="font-size:clamp(28px,4vw,40px);margin:18px 0">الذكاء الاصطناعي كجسر بين الفكرة والجمهور.</div><p class="sub" style="font-size:20px">نساعدك على تحسين طريقة إيصال المحتوى الإسلامي بما يلائم الجمهور، مع الحفاظ على المعنى وإتاحة التحقق من المصادر.</p><div class="row">${btn('ابدأ التحليل ←','ed','big')}${btn('▷ جرّب المثال','demo','s big')}</div></div><div class="c cn" style="background:var(--tb);border-radius:28px;display:grid;gap:12px;justify-items:center"><div class="c"><b>رسالتك</b></div>↓<div class="c" style="background:var(--t);color:#fff"><b>وِصال</b></div>↓<div class="c"><b>جمهورك</b></div></div></div><div class="c g g2" style="margin-top:20px">${[['استكشف وِصال',[['ابدأ التحليل','ed'],['جرّب المثال','demo'],['كيف يعمل وِصال؟','how']]],['المنهجية والثقة',[['المصادر والمنهجية','meth'],['السلامة والتحقق','safe'],['التوثيق','src']]]].map(c=>`<div><small style="color:var(--i3);font-weight:700">${c[0]}</small>${c[1].map(l=>`<div style="padding:10px 0;border-bottom:1px solid var(--ln)">← <a class="l" data-go="${l[1]}">${l[0]}</a></div>`).join('')}</div>`).join('')}</div>`
};
function render(){if(timer){clearInterval(timer);timer=null}$('#app').innerHTML=hdr()+'<main class="w" style="'+(cur==='home'?'padding:0 24px':'')+'">'+S[cur]()+'</main>';
 const ta=$('#ta');if(ta)ta.oninput=()=>{txt=ta.value;const n=wordCount(txt);$('#wc').textContent=n+' / 1500 كلمة';$('#wc').style.color=n>1500?'var(--er)':'var(--i3)'}; const cta=$('#custTa');if(cta)cta.oninput=()=>{custText=cta.value};
 if(cur==='proc'){if(ps<1)ps=1;timer=setInterval(()=>{if(ps<5){ps++;render()}},900);if(!analyzing)analyze()}}
const $=s=>document.querySelector(s); const wordCount=s=>(s||'').trim()?((s||'').trim().match(/\S+/g)||[]).length:0; const esc=s=>String(s??'').replace(/[&<>\"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[ch]));
async function analyze(){if(analyzing)return;analyzing=true;ai=null;aiErr='';try{
 const audience=['جمهور عام','جمهور عقلاني','جمهور روحي'][aud]||'جمهور عام';
 const goals=['تحليل الأسلوب فقط','اقتراح تحسين','تحليل الأسلوب واقتراح تحسين'];
 const r=await fetch(API+'/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt,audience,audienceDetails:cust?custText.trim():'',goal:goals[goal]})});
 let d={};try{d=await r.json()}catch{}
 if(!r.ok)throw new Error(d.error||d.details||('تعذر التحليل (HTTP '+r.status+')'));
 ai=d;ps=6;cur='ana';render();scrollTo(0,0)
 }catch(e){aiErr=e.message||'حدث خطأ أثناء تحليل النص بواسطة وكيل وِصال';cur='st';render();scrollTo(0,0)}
 finally{analyzing=false}}
function go(k){if(k==='proc'){ps=0;if(analyzing)return}cur=k;render();scrollTo(0,0)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);const a=e.target.closest('[data-act]');if(!a)return;const k=a.dataset.act;
 if(k.startsWith('aud')){aud=+k[3];render()}else if(k.startsWith('goal')){goal=+k[4];render()}
 else if(k==='cust'){cust=!cust;render()}else if(k==='ex'){txt=SAMPLE;render()}
 else if(k==='go'){const t=($('#ta')||{}).value;txt=t||'';const words=wordCount(txt);if(!txt.trim()||words>1500){aiErr='';go('st')}else go('proc')}
 else if(k==='demogo'){txt=SAMPLE;aud=1;go('proc')}
 else if(k==='copy'){navigator.clipboard&&navigator.clipboard.writeText((ai?.rewrite||'')).catch(()=>{});a.textContent='✓ تم النسخ'}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act],[data-go]:not(button)')){e.preventDefault();e.target.click()}});
render();
loadSources();async function loadSources(){try{const r=await fetch(API+'/api/sources');if(r.ok){const d=await r.json();approvedSources=Array.isArray(d.sources)?d.sources:[];if(cur==='src')render()}}catch{}}
</script>
</body></html>
