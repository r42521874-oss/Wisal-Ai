<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>وِصال | WISAL AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; font-family:Tajawal,sans-serif; background:#fff; color:#172525; }
    header { display:flex; justify-content:space-between; align-items:center; padding:16px 40px; border-bottom:1px solid #DCE7E6; }
    nav a { margin:0 12px; color:#657574; text-decoration:none; }
    .btn { background:#168B8A; color:#fff; border:2px solid #168B8A; padding:12px 24px; border-radius:12px; font:500 16px Tajawal; cursor:pointer; }
    .btn.light { background:#fff; color:#168B8A; }
    main { max-width:700px; margin:80px auto; padding:0 24px; }
    h1 { font-size:48px; line-height:1.4; margin:0 0 16px; }
    h1 span { color:#168B8A; }
    p { color:#657574; font-size:20px; margin-bottom:28px; }
  </style>
</head>
<body>
  <header>
    <strong>وِصال WISAL AI</strong>
    <nav><a href="#">الرئيسية</a><a href="#">المحرر</a><a href="#">كيف يعمل؟</a></nav>
    <button class="btn">ابدأ الآن</button>
  </header>
  <main>
    <h1>طوّر رسالتك الدعوية <span>لتصل بأثرٍ أعمق.</span></h1>
    <p>وِصال يساعدك على تكييف أسلوب المحتوى الإسلامي مع طبيعة جمهورك، مع الحفاظ على المعنى.</p>
    <button class="btn">ابدأ تحليل النص</button>
    <button class="btn light">كيف يعمل وِصال؟</button>
  </main>
</body>
</html>
